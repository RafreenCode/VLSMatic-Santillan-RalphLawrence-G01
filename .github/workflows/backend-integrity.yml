name: Backend integrity

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vlsmatic_test
          POSTGRES_USER: vlsmatic
          POSTGRES_PASSWORD: vlsmatic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vlsmatic -d vlsmatic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: remote
      LOCAL_HTTP: "false"
      # Tests exercise DEBUG=False explicitly for production error pages.
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
      DATABASE_URL: postgresql://vlsmatic:vlsmatic@127.0.0.1:5432/vlsmatic_test
      DATABASE_SSL_REQUIRE: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      PROFILE_PHOTO_STORAGE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput -v 1
