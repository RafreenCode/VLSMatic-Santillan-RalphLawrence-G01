<nav class="admin-tabs" aria-label="Administration sections">

    <span>Overview</span>
  </a>
  <a class="admin-tab{% if admin_active_tab == 'groups' %} is-active{% endif %}" href="{% url 'dashboard:admin_group_list' %}"{% if admin_active_tab == 'groups' %} aria-current="page"{% endif %}>
    <span>Groups</span>

  <a class="admin-tab{% if admin_active_tab == 'users' %} is-active{% endif %}" href="{% url 'dashboard:admin_user_list' %}"{% if admin_active_tab == 'users' %} aria-current="page"{% endif %}>
