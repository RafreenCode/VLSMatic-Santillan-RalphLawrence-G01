<header class="app-header">
  <a class="wordmark wordmark--dark" href="{% url 'dashboard:home' %}" aria-label="VLSMatic dashboard">
    <span class="wordmark__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>VLSMatic</span>
  </a>
  <nav class="app-nav" aria-label="Account navigation">
    <a href="{% url 'dashboard:home' %}">Dashboard</a>
    <a class="nav-profile" href="{% url 'accounts:profile' %}">
      {% if user.profile_photo_url %}<img class="nav-profile__avatar" src="{{ user.profile_photo_url }}" alt="">{% endif %}
      <span>Profile</span>
    </a>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </nav>
</header>
