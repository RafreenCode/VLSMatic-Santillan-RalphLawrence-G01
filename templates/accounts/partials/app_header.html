{% load static %}
<header class="app-header">
  <a class="brand-logo" href="{% url 'dashboard:home' %}" aria-label="VLSMatic dashboard">{% include "accounts/partials/brand_logo.html" %}</a>
  <nav class="app-nav" aria-label="Primary navigation">
    <a href="{% url 'dashboard:home' %}" {% if request.resolver_match.namespace == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="{% url 'network_projects:list' %}" {% if request.resolver_match.namespace == 'network_projects' %}aria-current="page"{% endif %}>Projects</a>
    <a class="nav-profile" href="{% url 'accounts:profile' %}" {% if request.resolver_match.namespace == 'accounts' and request.resolver_match.url_name == 'profile' %}aria-current="page"{% endif %}>
      {% if user.profile_photo_url %}<img class="nav-profile__avatar" src="{{ user.profile_photo_url }}" alt="">{% endif %}
      <span>Profile</span>
    </a>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </nav>
</header>
