{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VLSMatic — an explainable and visual IPv4 subnet planning system.">
  <meta name="theme-color" content="#001030">
  <title>{% block title %}VLSMatic{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}{{ static_version_query }}">
  <link rel="stylesheet" href="{% static 'css/planning-studio.css' %}{{ static_version_query }}">
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% if messages %}
    <div class="message-stack" aria-live="polite">
      {% for message in messages %}<div class="message message--{{ message.tags }}" role="{% if 'error' in message.tags or 'warning' in message.tags %}alert{% else %}status{% endif %}"><p class="message__text">{{ message }}</p></div>{% endfor %}
    </div>
  {% endif %}
  {% block layout %}{% endblock %}
  <script src="{% static 'js/planning-studio.js' %}{{ static_version_query }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
